name: Deploy Frontend to Cloud Run

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  PROJECT_ID: project-0990a5d7-310c-4a56-837
  REGION: asia-south1
  REPOSITORY: ods-repo
  SERVICE_NAME: ods-frontend
  IMAGE_NAME: frontend
  BACKEND_URL: https://employee-performance-api-302004244593.asia-south1.run.app

permissions:
  contents: read
  id-token: write
  pull-requests: read
  deployments: write

jobs:
  build-and-deploy-frontend:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Google Auth with Workload Identity
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/302004244593/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider
          service_account: github-actions@project-0990a5d7-310c-4a56-837.iam.gserviceaccount.com
          access_token_lifetime: 300s

      - name: Setup Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Configure Docker
        run: |
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      - name: Build and push Frontend Docker image
        run: |
          cd Frontend
          echo "Building frontend..."
          docker build -t frontend-build . || {
            echo "Docker build failed, checking files..."
            ls -la
            echo "Dockerfile content:"
            cat Dockerfile
            echo "nginx.conf content:"
            cat nginx.conf
            exit 1
          }
          echo "Tagging image..."
          docker tag frontend-build ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker tag frontend-build ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:latest
          echo "Pushing image..."
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:latest

      - name: Deploy Frontend to Cloud Run
        run: |
          echo "Deploying frontend service..."
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            --region ${{ env.REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --port 8080 \
            --memory 512Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 10 \
            --quiet || {
            echo "Deployment failed, checking service status..."
            gcloud run services describe ${{ env.SERVICE_NAME }} --region ${{ env.REGION }} --format="table(status.latestReadyRevisionName,status.url)" || echo "Service doesn't exist yet"
            exit 1
          }

      - name: Show service URL
        run: |
          echo "Frontend deployed at: $(gcloud run services describe ${{ env.SERVICE_NAME }} --region ${{ env.REGION }} --format='value(status.url)')"