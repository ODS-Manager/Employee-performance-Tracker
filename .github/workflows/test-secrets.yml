name: Test Secrets

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: List all secrets
        run: |
          echo "=== Checking secret availability ==="
          echo "WIF_PROVIDER exists: ${{ secrets.WIF_PROVIDER != '' }}"
          echo "SERVICE_ACCOUNT exists: ${{ secrets.SERVICE_ACCOUNT != '' }}"
          echo "PROJECT_ID exists: ${{ secrets.PROJECT_ID != '' }}"
          echo ""
          echo "=== Secret values (masked) ==="
          echo "WIF_PROVIDER: ${{ secrets.WIF_PROVIDER }}"
          echo "SERVICE_ACCOUNT: ${{ secrets.SERVICE_ACCOUNT }}"
          echo "PROJECT_ID: ${{ secrets.PROJECT_ID }}"
          
      - name: Test Google Auth with hardcoded values
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/302004244593/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider
          service_account: github-actions@project-0990a5d7-310c-4a56-837.iam.gserviceaccount.com
        continue-on-error: true