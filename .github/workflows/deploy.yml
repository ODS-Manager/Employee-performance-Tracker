name: Deploy to Cloud Run

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  PROJECT_ID: project-0990a5d7-310c-4a56-837
  REGION: asia-south1
  REPOSITORY: ods-repo
  SERVICE_NAME: employee-performance-api
  IMAGE_NAME: backend

permissions:
  contents: read
  id-token: write
  pull-requests: read
  deployments: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Debug environment
        run: |
          echo "=== ENVIRONMENT DEBUG ==="
          echo "Project ID: ${{ env.PROJECT_ID }}"
          echo "Region: ${{ env.REGION }}"
          echo "Service: ${{ env.SERVICE_NAME }}"
          echo "Repository: ${{ env.REPOSITORY }}"
          echo "Image: ${{ env.IMAGE_NAME }}"
          echo "GitHub SHA: ${{ github.sha }}"
          echo "========================"

      - name: Check backend structure
        run: |
          echo "=== FILES DEBUG ==="
          echo "Current directory:"
          pwd
          ls -la
          echo "Backend directory exists:"
          if [ -d "Backend" ]; then echo "YES"; ls Backend/; else echo "NO"; fi
          echo "Backend/app/main.py exists:"
          if [ -f "Backend/app/main.py" ]; then echo "YES"; else echo "NO"; fi
          echo "==================="

      - name: Google Auth with Workload Identity
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/302004244593/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider
          service_account: github-actions@project-0990a5d7-310c-4a56-837.iam.gserviceaccount.com
          access_token_lifetime: 300s
        continue-on-error: false

      - name: Setup Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Verify gcloud auth
        run: |
          echo "=== GCLOUD DEBUG ==="
          gcloud auth list
          gcloud config list
          echo "==================="

      - name: Configure Docker
        run: |
          echo "=== DOCKER CONFIG ==="
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev
          echo "==================="

      - name: Validate Docker build context
        run: |
          echo "=== VALIDATION ==="
          echo "Build context contents:"
          find . -name "*.py" -type f | head -10
          echo "Backend structure:"
          ls -la Backend/
          echo "Backend/app structure:"
          ls -la Backend/app/ || echo "Backend/app directory not found"
          echo "Dockerfile exists:"
          test -f Backend/Dockerfile && echo "YES" || echo "NO"
          echo "requirements.txt exists:"
          test -f Backend/requirements.txt && echo "YES" || echo "NO"
          echo "main.py exists:"
          test -f Backend/app/main.py && echo "YES" || echo "NO"
          echo "==================="

      - name: Build Docker image with debug
        run: |
          echo "=== DOCKER BUILD ==="
          echo "Building from Backend directory..."
          echo "Checking Backend structure:"
          ls -la Backend/
          echo "Environment variables for build:"
          echo "DATABASE_URL=postgresql://ods_user:ods_password@/ods_db?host=/cloudsql/project-0990a5d7-310c-4a56-837:asia-south1:ods-database"
          echo "SECRET_KEY=dev-secret-key-for-production"
          echo "CORS_ORIGINS=http://localhost:3000,https://*"
          echo "PORT=8080"
          docker build \
            --build-arg DATABASE_URL=postgresql://ods_user:ods_password@/ods_db?host=/cloudsql/project-0990a5d7-310c-4a56-837:asia-south1:ods-database \
            --build-arg SECRET_KEY=dev-secret-key-for-production \
            --build-arg CORS_ORIGINS=http://localhost:3000,https://* \
            -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -f Backend/Dockerfile . || {
            echo "Docker build failed, checking files..."
            ls -la Backend/
            echo "Current directory:"
            pwd
            echo "Dockerfile content:"
            cat Backend/Dockerfile
            echo "Build context:"
            find . -maxdepth 2 -type f -name "*.py" | head -5
            exit 1
          }
          echo "Docker image built successfully"
          docker images | grep ${{ env.IMAGE_NAME }}
          echo "==================="

      - name: Push Docker image
        run: |
          echo "=== DOCKER PUSH ==="
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker tag ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:latest
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:latest
          echo "Docker push completed"
          echo "==================="

      - name: Deploy to Cloud Run
        run: |
          echo "=== CLOUD RUN DEPLOY ==="
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            --region ${{ env.REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --port 8080 \
            --memory 512Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 10 \
            --service-account github-actions@project-0990a5d7-310c-4a56-837.iam.gserviceaccount.com \
            --env-vars-file .github/config/env-vars.yaml \
            --add-cloudsql-instances project-0990a5d7-310c-4a56-837:asia-south1:ods-database \
            --quiet && {
            echo "Deployment successful with env-vars-file"
            exit 0
          } || {
            echo "env-vars-file approach failed, trying individual --set-env-vars..."
            gcloud run deploy ${{ env.SERVICE_NAME }} \
              --image ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
              --region ${{ env.REGION }} \
              --platform managed \
              --allow-unauthenticated \
              --port 8080 \
              --memory 512Mi \
              --cpu 1 \
              --min-instances 0 \
              --max-instances 10 \
              --service-account github-actions@project-0990a5d7-310c-4a56-837.iam.gserviceaccount.com \
              --set-env-vars DATABASE_URL=postgresql://ods_user:ods_password@/ods_db?host=/cloudsql/project-0990a5d7-310c-4a56-837:asia-south1:ods-database,SECRET_KEY=dev-secret-key-for-production,CORS_ORIGINS=https://ods-frontend-302004244593.asia-south1.run.app\\,http://localhost:3000,FRONTEND_URL=https://ods-frontend-302004244593.asia-south1.run.app \
              --add-cloudsql-instances project-0990a5d7-310c-4a56-837:asia-south1:ods-database \
              --quiet || {
              echo "Both deployment methods failed, checking service status..."
              gcloud run services describe ${{ env.SERVICE_NAME }} --region ${{ env.REGION }} --format="table(status.latestReadyRevisionName,status.url)" || echo "Service doesn't exist yet"
              exit 1
            }
            echo "Deployment successful with individual env vars"
          }
          echo "Deployment successful"
          echo "==================="

      - name: Show service URL
        run: |
          echo "=== SERVICE INFO ==="
          SERVICE_URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} --region ${{ env.REGION }} --format='value(status.url)')
          echo "Service deployed at: $SERVICE_URL"
          echo "Testing health endpoint:"
          curl -f "$SERVICE_URL/health" || echo "Health check failed"
          echo "==================="